name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read

jobs:
  # ============================================================
  # 1. SOURCE SECURITY
  # ============================================================

  source-security:
    name: Source Security Scans
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------
      # Secret scanning
      # ------------------------------

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" | grep -Po '"tag_name": "v\K[0-9.]+')
          wget -qO gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          sudo tar xf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
          rm -rf gitleaks.tar.gz


      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --exit-code 1
      # ------------------------------
      # SAST
      # ------------------------------

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v4
  # ============================================================
  # 2. DEPENDENCY SECURITY
  # ============================================================

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [user-service, order-service]

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dependency tree
        working-directory: ${{ matrix.service }}
        run: |
          mvn dependency:tree

      - name: OWASP Dependency Check
        working-directory: ${{ matrix.service }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - name: Unit tests
      working-directory: ${{ matrix.service }}
      run: mvn -B clean test
    - name: Package
      working-directory: ${{ matrix.service }}
      run: mvn -B package -DskipTests
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.service }}-test-reports
        path: ${{ matrix.service }}/target/surefire-reports/

  docker:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - name: Build JAR
      working-directory: ${{ matrix.service }}
      run: mvn -B package -DskipTests
    - name: Build image
      run: docker build -t ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ matrix.service }}:${{ github.sha }}
        format: table
        exit-code: "0"
        ignore-unfixed: true
        severity: CRITICAL,HIGH
