name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - name: Unit tests
      working-directory: ${{ matrix.service }}
      run: mvn -B clean test
    - name: Package
      working-directory: ${{ matrix.service }}
      run: mvn -B package -DskipTests
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-test-reports
        path: ${{ matrix.service }}/target/surefire-reports/

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
    - name: Build JAR
      working-directory: ${{ matrix.service }}
      run: mvn -B package -DskipTests
    - name: Build image
      run: docker build -t ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
    - name: Trivy scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ matrix.service }}:${{ github.sha }}
        format: table
        exit-code: "1"
        ignore-unfixed: true
        severity: CRITICAL,HIGH
